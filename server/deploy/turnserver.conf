# coturn config - relay for symmetric NAT, mobile 5G/CGNAT and strict firewalls (media stays end-to-end encrypted).
# external-ip / realm / secret are NOT written here: coturn-entrypoint.sh detects the current public IP at every start
# (works with dynamic IPs and cloud VMs behind 1:1 NAT) and passes them on the command line.
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
fingerprint
use-auth-secret
realm=nexadesk
# UDP + TCP relaying (TCP/TLS is what gets through carriers and Wi-Fi that block UDP)
no-tlsv1
no-tlsv1_1
# relay port range: must match firewall.sh; ~1000 ports = ~500 concurrent sessions
min-port=49152
max-port=50151
# abuse limits
user-quota=12
total-quota=400
stale-nonce=600
no-multicast-peers
no-cli
no-software-attribute
# never let a relay reach private/internal networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# TLS on 5349 (turns:) - uncomment after getting a certificate for your domain
# cert=/etc/letsencrypt/live/YOUR.DOMAIN/fullchain.pem
# pkey=/etc/letsencrypt/live/YOUR.DOMAIN/privkey.pem
