# coturn config - relay fallback for symmetric NAT / corporate firewalls (media stays end-to-end encrypted)
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_same_value_as_server_config_turn_secret
realm=nexadesk
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
min-port=49160
max-port=49200
# cert=/etc/letsencrypt/live/YOUR.DOMAIN/fullchain.pem
# pkey=/etc/letsencrypt/live/YOUR.DOMAIN/privkey.pem
