# docker compose up -d   (edit secrets first; put a TLS reverse proxy such as Caddy in front of port 8080)
services:
  signaling:
    image: node:20-alpine
    working_dir: /app
    volumes: ["../:/app"]
    command: sh -c "npm install --omit=dev && node server.js"
    ports: ["8080:8080"]
    restart: unless-stopped
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes: ["./turnserver.conf:/etc/coturn/turnserver.conf:ro"]
    restart: unless-stopped
